name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Godot y Android
        run: |
          mkdir -p $HOME/.config/godot build/android
          TPL="$(find /root /usr /opt -type f -name android_debug.apk -path '*export_templates*' 2>/dev/null | head -n 1)"
          echo "Plantillas encontradas en: $TPL"
          mkdir -p $HOME/.local/share/godot/export_templates/4.3.stable
          cp -r "$(dirname "$TPL")"/. $HOME/.local/share/godot/export_templates/4.3.stable/
          ls $HOME/.local/share/godot/export_templates/4.3.stable
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore $HOME/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          SDK="${ANDROID_HOME:-/usr/lib/android-sdk}"
          JDK="$(dirname "$(dirname "$(readlink -f "$(which javac)")")")"
          for f in editor_settings-4.tres editor_settings-4.3.tres; do
            cat > $HOME/.config/godot/$f <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JDK"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done

      - name: Exportar APK
        run: |
          godot --headless --import || true
          godot --headless --verbose --export-debug "Android" build/android/parkour.apk

      - uses: actions/upload-artifact@v4
        with:
          name: parkour-apk
          path: build/android/parkour.apk
